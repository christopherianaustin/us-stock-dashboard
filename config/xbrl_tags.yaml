operating_cash_flow:
  label: Operating cash flow
  statement: cashflow
  kind: duration
  unit: USD
  tags: [NetCashProvidedByUsedInOperatingActivities]
capex:
  label: Capital expenditure
  statement: cashflow
  kind: duration
  unit: USD
  tags: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
da:
  label: Depreciation & amortization
  statement: cashflow
  kind: duration
  unit: USD
  tags:
    - DepreciationDepletionAndAmortization
    - DepreciationAndAmortization
    - DepreciationAmortizationAndAccretionNet
    - DepreciationAmortizationAndOther   # e.g. MSFT (older years)
    - Depreciation                       # last resort (MSFT, TSLA now): excludes amortization, so EBITDA is slightly understated
dividends_paid:
  label: Dividends paid
  statement: cashflow
  kind: duration
  unit: USD
  tags: [PaymentsOfDividends, PaymentsOfDividendsCommonStock]
buybacks:
