retained_earnings:
  label: Retained earnings
  statement: balance
  kind: instant
  unit: USD
  tags: [RetainedEarningsAccumulatedDeficit]
shares_outstanding:
  label: Shares outstanding
  statement: balance
  kind: instant
  unit: shares
