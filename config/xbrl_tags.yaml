short_term_investments:
  label: Short-term investments
  statement: balance
  kind: instant
  unit: USD
  tags: [ShortTermInvestments, MarketableSecuritiesCurrent]
receivables:
  label: Receivables
  statement: balance
  kind: instant
  unit: USD
  tags: [AccountsReceivableNetCurrent]
inventory:
  label: Inventory
  statement: balance
  kind: instant
  unit: USD
  tags: [InventoryNet]
total_liabilities:
  label: Total liabilities
  statement: balance
  kind: instant
  unit: USD
  tags: [Liabilities]
current_liabilities:
  label: Current liabilities
  statement: balance
  kind: instant
  unit: USD
  tags: [LiabilitiesCurrent]
short_term_debt:
  label: Short-term debt
  statement: balance
  kind: instant
  unit: USD
  tags: [DebtCurrent, LongTermDebtCurrent, ShortTermBorrowings, CommercialPaper]
long_term_debt:
  label: Long-term debt
  statement: balance
  kind: instant
  unit: USD
  tags: [LongTermDebtNoncurrent, LongTermDebt]
equity:
  label: Shareholders' equity
  statement: balance
  kind: instant
  unit: USD
  tags: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
equity_incl_nci:
  label: Equity incl. minority interest
  statement: balance
  kind: instant
  unit: USD
